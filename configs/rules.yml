# bandage rules, format version 0.
#
# A rule matches when its filter accepts the event and its tracker
# overflows; its report action then writes a report about the offending
# target. An escalation ladder (iso-egress-ladder below) climbs the
# response as one accumulation grows: a handoff rung, a throttle
# recommendation, a ban. Validate before deploying: bandage -t -c
# bandage.yml -r rules.yml.
version: 0

chains:
  # The entry chain: the front door, one filter-less jump rule per
  # topical chain in file order (a jump is non-terminal: it runs the
  # target chain and resumes, so the dispatch sequences exactly like
  # the chains' own file order). The handoff target (inspect) is left
  # to the ladder's jump rung.
  - name: main
    rules:
      - id: dispatch-download-abuse
        actions: [{jump: download-abuse}]
      - id: dispatch-api
        actions: [{jump: api}]
      - id: dispatch-iso-egress
        actions: [{jump: iso-egress}]

  - name: download-abuse
    rules:
      - id: sustained-iso-egress
        filter: any
        tracker:
          track: bandwidth
          leak: 1MB
          volume: 100GB
          target_prefix: {ipv4: 24, ipv6: 64}
        actions:
          - report:
              reason: iso-egress-overflow
              ttl: 7d
              penalty: limit-bandwidth
              rate: 1MB

      - id: iso-download-flood
        filter: any
        tracker:
          track: rate
          leak: 10
          volume: 100
          target_prefix: {ipv4: 24, ipv6: 64}
        actions:
          - report:
              reason: iso-download-overflow
              ttl: 24h
              penalty: limit-req-rate
              rate: 100

  - name: api
    rules:
      - id: bursty-api
        tracker:
          track: rate
          leak: 10/s
          volume: 200
        actions:
          - report:
              reason: api-rate-overflow
              ttl: 12h
              penalty: limit-req-rate
              rate: 200

  # The worked escalation ladder: one bandwidth accumulation, the
  # response climbing from a handoff rung (jump to per-path inspection)
  # to a throttle recommendation to a ban recommendation.
  - name: iso-egress
    rules:
      - id: iso-egress-ladder
        tracker: {track: bandwidth, leak: 1MB}
        escalations:
          - at: 50MB
            actions: [{jump: inspect}]
          - at: 5GB
            actions:
              - report:
                  reason: iso-egress-throttle
                  ttl: 24h
                  penalty: limit-bandwidth
                  rate: 1MB
          - at: 40GB
            actions:
              - report:
                  reason: iso-egress-ban
                  ttl: 7d
                  penalty: drop

  # The handoff target: per-path replay inspection of suspect targets.
  - name: inspect
    rules:
      - id: iso-replay-inspect
        filter: 'path suffix ".iso"'
        tracker:
          track: replay
          leak: 0.1
          volume: 3
          target_prefix: {ipv4: 24, ipv6: 64}
        actions:
          - report:
              reason: iso-replay-overflow
              ttl: 24h
              penalty: limit-bandwidth
              rate: 1MB
