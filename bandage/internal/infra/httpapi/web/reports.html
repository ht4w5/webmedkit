<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bandage Web Panel - Reports</title>
<link rel="stylesheet" href="/common.css">
</head>
<body>
<header class="header">
  <div class="title">
    <h1><a href="/stats">bandage</a></h1>
  </div>
  <div id="view" class="menu-item">
    <div class="menu-name">
      View
      <i class="downArrow"></i>
    </div>
    <div class="submenu">
      <a href="/stats">Stats</a>
      <a class="active" href="/reports">Reports</a>
    </div>
  </div>
  <div class="menu-item">
    <button id="refresh" class="menu-name" type="button">Refresh</button>
  </div>
  <div>
    <input id="search" type="text" placeholder="Search regexp" autocomplete="off" autocapitalize="none" size="40">
  </div>
  <div class="legend" id="legend"></div>
</header>
<main id="content">
  <p id="search-error" class="filter-error" role="alert" hidden></p>
  <p id="empty-state" hidden></p>
  <table id="report-table" class="reports">
    <thead>
      <tr><th>Rule</th><th>Target</th><th>Tracker reading</th><th>Updated</th><th>Delete</th></tr>
    </thead>
    <tbody id="report-rows">
      <tr><td class="empty" colspan="5">Loading...</td></tr>
    </tbody>
  </table>
</main>
<script src="/common.js"></script>
</body>
</html>
